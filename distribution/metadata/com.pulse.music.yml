AutoName: Pulse Music
Summary: Ad-free music player with synced lyrics, 85dB ear care & zero freeze
Description: |-
  Pulse Music is a next-generation open-source music player and streaming application designed for pure, uninterrupted listening pleasure on Android and Windows. Built with Compose Multiplatform, Pulse delivers a silky-smooth, ad-free experience powered by advanced audio technologies.

  Features:
  * Listen Healthy & 85dB WHO safe headphone volume limiter
  * Dynamic Song Discovery Mix slider and smart radio blending
  * Asynchronous zero-lock continuous playback engine with 0 freezes
  * Real-time Apple Music and Spotify hybrid styled synchronized lyrics
  * Multilingual romanization for 12+ scripts (Japanese, Korean, Chinese, Tamil, Hindi, Arabic)
  * Dynamic ambient lighting matched to album artwork
  * 10-band equalizer, AutoEq headphone presets, and spatial 8D audio
  * Pure Dark AMOLED, Pastel Pearl Lavender, Light & System Default themes
  * Android Auto support and Windows desktop companion app
  * Ad-free, 100% privacy-first and open source

