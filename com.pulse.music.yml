AutoName: Pulse Music
Summary: Modern music player with real-time lyrics & seamless continuous playback
Description: |-
  Experience music like never before with Pulse Music.

  Features:
  * Ad-free streaming in background
  * Continuous playback engine with zero freezes and rapid skipping
  * Real-time synchronized lyrics (Musixmatch, LRCLIB, Spotify)
  * Seamless background Gemini AI translation
  * Offline caching and downloaded songs support
  * Equalizer, spatial audio, and sound enhancements
  * Home, Charts, Moods & Genres with high-speed browsing
  * SponsorBlock & Return YouTube Dislike integration
  * In-app OTA updates and trending music notifications
  * Sleep timer and Android Auto support

