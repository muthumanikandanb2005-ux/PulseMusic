name: Pulse Music Release Update

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g., v1.1.0)'
        required: true
        default: 'v1.1.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Pulse Music Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Android Release APK
        run: |
          ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p release-assets
          APK_PATH=$(find androidApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK found, checking unsigned..."
            APK_PATH=$(find androidApp/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          TAG_NAME="${{ github.event.inputs.version_tag || github.ref_name }}"
          cp "$APK_PATH" "release-assets/PulseMusic-${TAG_NAME}.apk"
          echo "Copied to release-assets/PulseMusic-${TAG_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: Pulse Music ${{ github.event.inputs.version_tag || github.ref_name }}
          body: |
            ## 🎵 Pulse Music Update
            
            This is an automated release for **Pulse Music**.
            
            ### What's New:
            - Pure, clean audio experience with zero ads
            - Real-time cloud sync with Supabase
            - Cinematic audio enhancements
            - High-fidelity background playback
            - Automatic background update delivery
          files: release-assets/PulseMusic-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
