name: Feature Request
description: Propose an idea or enhancement for Pulse Music
labels: [ "feat:unconfirmed" ]

body:
  - type: markdown
    attributes:
      value: |
        💡 **Feature Requests for Pulse Music**  
        Thank you for helping improve Pulse Music! Please describe your proposed enhancement clearly.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Pain Point
      placeholder: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & Experience
      placeholder: Describe in detail how you would like this feature to look and behave in Pulse Music.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches Considered
      placeholder: What other alternatives or workarounds have you considered?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      placeholder: Attach any mockups, references from other audio players, or links.
    validations:
      required: false
